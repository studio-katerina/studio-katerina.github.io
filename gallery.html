<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Портфолио | Студия красоты Катерина</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="style-gallery.css">
</head>
<body>

    <header>
        <div class="logo">Студия красоты Катерина</div>
        <nav class="nav-links">
            <a href="index.html">На главную</a>
            <a href="index.html#services">Услуги</a>
            <a href="index.html#contacts">Контакты</a>
            <a href="https://telegram.me/parik_katya_bot" target="_blank" rel="noopener noreferrer" class="btn">Записаться</a>
        </nav>
    </header>

    <section class="gallery-section">
        <h2 class="section-title">Портфолио работ</h2>
        <div class="gallery-grid" id="gallery-grid"></div>
    </section>

    <div id="lightbox" class="lightbox" onclick="closeLightbox()">
        <span class="close">&times;</span>
        <img id="lightbox-img" src="" alt="">
    </div>

    <a href="index.html" class="back-btn">← Назад</a>

    <footer>
        <p>&copy; <span id="current-year"></span> Студия красоты Катерина. Все права защищены.</p>
    </footer>

    <script src="photos.js"></script>
    <script>
        // Рендер всей галереи из массива photos
        const galleryGrid = document.getElementById('gallery-grid');
        photos.forEach(p => {
            const item = document.createElement('div');
            item.className = 'gallery-item';
            item.addEventListener('click', () => openLightbox(p.src));

            const img = document.createElement('img');
            img.src = p.src;
            img.alt = p.alt;
            img.loading = 'lazy';
            if (p.isReview) img.className = 'review-img';

            const caption = document.createElement('div');
            caption.className = 'caption';
            caption.textContent = p.caption || '';

            item.appendChild(img);
            item.appendChild(caption);
            galleryGrid.appendChild(item);
        });

        function openLightbox(imageSrc) {
            document.getElementById('lightbox').style.display = "block";
            document.getElementById('lightbox-img').src = imageSrc;
        }
        function closeLightbox() {
            document.getElementById('lightbox').style.display = "none";
        }
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closeLightbox();
        });

        document.getElementById('current-year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
